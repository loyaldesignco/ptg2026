<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PTG · schools across NYC &amp; Long Island</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous"></script>
<script src="https://unpkg.com/d3@7.9.0/dist/d3.min.js" integrity="sha384-CjloA8y00+1SDAUkjs099PVfnY2KmDC2BZnws9kh8D/lX1s46w6EPhpXdqMfjK6i" crossorigin="anonymous"></script>
<script src="https://unpkg.com/topojson-client@3.1.0/dist/topojson-client.min.js" integrity="sha384-Ukv1p/xTma6P4/2bY5KzWBw+ydSpXmhCMtyciIQVDJ1RmOxtCYNMF1uXT9T63H67" crossorigin="anonymous"></script>
<style>
  html,body{margin:0;height:100%;background:transparent}
  #map{position:absolute;inset:0;background:transparent;pointer-events:none}
  .leaflet-container{background:transparent;font-family:'Hanken Grotesk',system-ui,sans-serif}
  .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) grayscale(.8) brightness(1.05) contrast(1.15)}
  .leaflet-control-attribution{background:transparent!important;color:rgba(255,255,255,.28)!important;font-size:9.5px;padding:0 6px}
  .leaflet-control-attribution a{color:rgba(255,255,255,.35)!important}
  .pin{position:relative}
  .pin i{position:absolute;left:50%;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;display:block;background:url(assets/logo-mark-color.svg) center/contain no-repeat;filter:drop-shadow(0 2px 8px rgba(2,2,2,.85))}
  .pin b{position:absolute;left:22px;top:-7px;white-space:nowrap;font-size:11.5px;font-weight:400;letter-spacing:.02em;color:#fff;text-shadow:0 1px 6px rgba(2,2,2,.9)}
  .pin.ct b{color:#F9B62C}
  .dot{opacity:0;transition:opacity .6s ease}
  .dot.on{opacity:.9}
</style>
</head>
<body>
<div id="map"></div>
<script>
(async function(){
  const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const offices = [
    { n: 'Long Island HQ', lat: 40.8126, lng: -73.6270, cls: '' },
    { n: 'Manhattan', lat: 40.7580, lng: -73.9855, cls: '' },
    { n: 'PTG North · Milford, CT', lat: 41.2223, lng: -73.0565, cls: 'ct' },
  ];
  const map = L.map('map', {
    center: [40.88, -73.70], zoom: 9, zoomControl: false, scrollWheelZoom: false, attributionControl: true,
    keyboard: false, dragging: false, touchZoom: false, doubleClickZoom: false, boxZoom: false, tap: false, inertia: false,
    preferCanvas: true
  });
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap contributors', maxZoom: 12 }).addTo(map);

  // School points: seeded to approximate real counts (NYC ~1,800 public + ~270 charter + ~900 private; Nassau/Suffolk ~700 public + ~250 private; Westchester ~250 public + ~120 private),
  // placed inside real county polygons (US Atlas / Census). Not individual schools. Replace with NCES/NYSED points when available.
  const us = await fetch('https://cdn.jsdelivr.net/npm/us-atlas@3.0.1/counties-10m.json').then(r => r.json());
  const counties = topojson.feature(us, us.objects.counties).features;
  const SEED = { '36061':[720,.16], '36047':[900,.2], '36081':[640,.11], '36005':[560,.19], '36085':[150,.07], '36059':[470,.01], '36103':[520,.01], '36119':[370,.03] };
  const rnd = d3.randomLcg(42), pts = [];
  counties.filter(f => SEED[f.id]).forEach(f => {
    const [n, ch] = SEED[f.id], b = d3.geoBounds(f); let k = 0, g = 0;
    while (k < n && g < n * 40) { g++; const lon = b[0][0] + (b[1][0]-b[0][0]) * rnd(), lat = b[0][1] + (b[1][1]-b[0][1]) * rnd(); if (d3.geoContains(f, [lon, lat])) { pts.push({ lat, lon, charter: rnd() < ch }); k++; } }
  });
  const renderer = L.canvas({ padding: .5 });
  const layer = L.layerGroup().addTo(map);
  const circles = pts.map(p => L.circleMarker([p.lat, p.lon], { renderer, radius: p.charter ? 2.4 : 1.4, stroke: false, fillColor: p.charter ? '#FBCD6B' : '#F9B62C', fillOpacity: 0, interactive: false }).addTo(layer));

  offices.forEach(o => L.marker([o.lat, o.lng], { interactive: false, icon: L.divIcon({ className: '', html: '<span class="pin ' + o.cls + '"><i></i><b>' + o.n + '</b></span>', iconSize: [0, 0] }) }).addTo(map));

  // reveal west → east
  const xs = pts.map(p => p.lon), minX = Math.min(...xs), maxX = Math.max(...xs);
  if (RM) { circles.forEach(c => c.setStyle({ fillOpacity: .9 })); }
  else {
    const t0 = performance.now();
    (function sweep(now) {
      const t = (now - t0 - 400) / 2400; let done = true;
      circles.forEach((c, i) => { const p = pts[i], at = (p.lon - minX) / (maxX - minX); const o = Math.max(0, Math.min(1, (t - at) * 4)); if (o < 1) done = false; c.setStyle({ fillOpacity: .9 * o }); });
      if (!done) requestAnimationFrame(sweep);
    })(t0);
  }
  // breathing office reach rings (same as the CT page)
  const rings = offices.map(o => ({ o, edge: L.circle([o.lat, o.lng], { radius: 0, color: '#F9B62C', weight: 1, opacity: 0, fill: false }).addTo(map) }));
  if (!RM) {
    const ease = t => 1 - Math.pow(1 - t, 3), DUR = 2600, STAGGER = 520, HOLD = 2200, CYCLE = DUR + STAGGER * 2 + HOLD; let s0 = performance.now();
    (function frame(now) { const t = (now - s0) % CYCLE; rings.forEach((r, i) => { const l = Math.max(0, Math.min(1, (t - i * STAGGER) / DUR)); r.edge.setRadius(30000 * ease(l)); r.edge.setStyle({ opacity: .45 * (1 - l) }); }); requestAnimationFrame(frame); })(s0);
  }
  addEventListener('resize', () => map.invalidateSize());
})();
</script>
</body>
</html>
